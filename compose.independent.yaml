# Independently managed service. No databases, seeds or sibling build contexts.
name: neola-storage-service
services:
  storage:
    build:
      context: .
      target: runtime
    image: ${IMAGE:-neola-storage-service:local}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3052/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - path: .env.container
        format: raw
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-5004}:3052'
    networks:
      platform:
        aliases: [storage]
    volumes:
      - uploads:/app/uploads
networks:
  platform:
    external: true
    name: ${NEOLA_NETWORK:-neola-platform}
volumes:
  uploads:
    external: true
    name: ${STORAGE_VOLUME:?Set STORAGE_VOLUME to the existing or restored uploads volume}
